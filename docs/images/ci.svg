<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f2430"/>
      <stop offset="100%" stop-color="#2b3242"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="330" rx="12" fill="#161a22"/>
  <rect x="0" y="0" width="900" height="38" rx="12" fill="url(#hdr)"/>
  <circle cx="22" cy="19" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="19" r="6" fill="#febc2e"/>
  <circle cx="62" cy="19" r="6" fill="#28c840"/>
  <text x="450" y="24" fill="#9aa4b8" font-size="13" text-anchor="middle">harscope ci trace.har --max-requests 50 --max-transfer-kb 2048 --max-p95-ms 300 --require-https</text>

  <text x="24" y="70" fill="#e6edf3" font-size="14">$ harscope ci examples/sample.har</text>

  <!-- header row -->
  <text x="24"  y="104" fill="#7d8798" font-size="12">结果</text>
  <text x="96"  y="104" fill="#7d8798" font-size="12">检查项</text>
  <text x="230" y="104" fill="#7d8798" font-size="12">实测</text>
  <text x="330" y="104" fill="#7d8798" font-size="12">阈值</text>
  <text x="450" y="104" fill="#7d8798" font-size="12">建议</text>
  <line x1="24" y1="112" x2="876" y2="112" stroke="#2b3242" stroke-width="1"/>

  <!-- rows -->
  <g font-size="13">
    <text x="24"  y="138" fill="#3fb950">✅ PASS</text>
    <text x="96"  y="138" fill="#e6edf3">请求总数</text>
    <text x="230" y="138" fill="#e6edf3">14 条</text>
    <text x="330" y="138" fill="#7d8798">≤ 50 条</text>

    <text x="24"  y="166" fill="#3fb950">✅ PASS</text>
    <text x="96"  y="166" fill="#e6edf3">总传输体积</text>
    <text x="230" y="166" fill="#e6edf3">1.4 MB</text>
    <text x="330" y="166" fill="#7d8798">≤ 2,048 KB</text>

    <text x="24"  y="194" fill="#3fb950">✅ PASS</text>
    <text x="96"  y="194" fill="#e6edf3">P95 耗时</text>
    <text x="230" y="194" fill="#e6edf3">193 ms</text>
    <text x="330" y="194" fill="#7d8798">≤ 300 ms</text>

    <text x="24"  y="222" fill="#f85149">❌ FAIL</text>
    <text x="96"  y="222" fill="#e6edf3">全站 HTTPS</text>
    <text x="230" y="222" fill="#f0883e">1 条明文</text>
    <text x="330" y="222" fill="#7d8798">0 条明文</text>
    <text x="450" y="222" fill="#c9b458">统一替换为 https:// 并开启 HSTS。</text>

    <text x="24"  y="250" fill="#3fb950">✅ PASS</text>
    <text x="96"  y="250" fill="#e6edf3">重复请求组数</text>
    <text x="230" y="250" fill="#e6edf3">1 组</text>
    <text x="330" y="250" fill="#7d8798">≤ 2 组</text>

    <text x="24"  y="278" fill="#f85149">❌ FAIL</text>
    <text x="96"  y="278" fill="#e6edf3">安全发现总数</text>
    <text x="230" y="278" fill="#f0883e">24 条</text>
    <text x="330" y="278" fill="#7d8798">≤ 2 条</text>
    <text x="450" y="278" fill="#c9b458">按 harscope security 输出逐项修复。</text>
  </g>

  <text x="24" y="312" fill="#f85149" font-size="14">❌ 2/6 项未达标</text>
  <text x="876" y="312" fill="#7d8798" font-size="12" text-anchor="end">exit code 1</text>
</svg>
